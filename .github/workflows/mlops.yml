name: MLOps Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

# ===================================================
# JOB 1 - TEST
# ===================================================
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


# ===================================================
# JOB 2 - TRAIN
# ===================================================
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest

    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    env:
      CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "dvc[s3]"

      # -------------------------------
      # AWS AUTH (FIXED)
      # -------------------------------
      - name: Setup AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}" >> $GITHUB_ENV

      # -------------------------------
      # DVC PULL
      # -------------------------------
      - name: Pull data with DVC
        run: dvc pull

      # -------------------------------
      # TRAIN MODEL
      # -------------------------------
      - name: Train model
        run: python src/train.py

      # -------------------------------
      # READ METRICS
      # -------------------------------
      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      # -------------------------------
      # UPLOAD MODEL TO S3 (FIXED)
      # -------------------------------
      - name: Upload model to S3
        run: |
          python - <<'EOF'
          import boto3
          import os

          bucket = os.environ["CLOUD_BUCKET"]

          s3 = boto3.client("s3")

          s3.upload_file(
              "models/model.pkl",
              bucket,
              "models/latest/model.pkl"
          )

          print("Model uploaded to S3")
          EOF

      # -------------------------------
      # SAVE METRICS
      # -------------------------------
      - name: Save metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json


# ===================================================
# JOB 3 - EVAL
# ===================================================
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Check accuracy gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")

          if acc < 0.65:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70")

          print(f"PASSED: accuracy {acc:.4f}")
          EOF


# ===================================================
# JOB 4 - DEPLOY
# ===================================================
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}

          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "OK" || exit 1